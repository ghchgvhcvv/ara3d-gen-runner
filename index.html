<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D Gen — Character Generator</title>
    <link rel="stylesheet" href="/src/app/style.css" />
  </head>
  <body>
    <aside id="panel">
      <header>
        <h1>3D Gen <span>realistic humans</span></h1>
        <div class="row">
          <select id="preset"></select>
          <button id="randomize" title="Random character">🎲 Randomize</button>
        </div>
        <div class="row">
          <label class="grow">Name <input id="name" type="text" /></label>
          <label>Seed <input id="seed" type="number" min="0" step="1" /></label>
        </div>
      </header>
      <div id="controls"></div>
    </aside>
    <main>
      <canvas id="viewport"></canvas>
      <div id="loading">Loading character assets…</div>
      <div id="stats"></div>
      <div id="view-tools">
        <label><input type="checkbox" id="wireframe" /> Wireframe</label>
        <label><input type="checkbox" id="skeleton" /> Skeleton</label>
        <label><input type="checkbox" id="face" /> Face close-up</label>
      </div>
      <div id="anim-bar"></div>
      <div id="rig-pop" hidden></div>
      <div id="export">
        <button id="rig-btn" title="Rig and animation options for GLB / FBX"></button>
        <span>Export</span>
        <button data-format="glb">GLB</button>
        <button data-format="fbx">FBX</button>
        <button data-format="obj" title="OBJ + MTL + textures (static, no rig)">OBJ</button>
        <button data-format="zip" class="primary">ZIP (all)</button>
      </div>
    </main>
    <script type="module" src="/src/app/main.ts"></script>
  </body>
</html>
